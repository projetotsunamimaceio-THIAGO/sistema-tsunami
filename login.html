<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSUNAMI - Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap');

        * { box-sizing: border-box; }

        body {
            background: #060710;
            color: white;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Aurora backdrop */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 480px; height: 480px;
            top: -160px; left: -120px;
            background: radial-gradient(circle, rgba(0,229,255,0.25), transparent 70%);
        }
        body::after {
            width: 420px; height: 420px;
            bottom: -140px; right: -100px;
            background: radial-gradient(circle, rgba(224,64,251,0.16), transparent 70%);
        }

        .font-brand { font-family: 'Outfit', sans-serif; }

        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .neon-text {
            background: linear-gradient(90deg, #00e5ff, #7bffd1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 18px rgba(0,229,255,0.35));
        }

        .logo-badge {
            width: 76px; height: 76px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1rem;
            display: block;
            border: 2px solid rgba(0,229,255,0.55);
            box-shadow: 0 0 30px rgba(0,229,255,0.25);
        }

        .field-wrap { position: relative; }
        .field-wrap i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: rgba(0,229,255,0.55); font-size: 0.85rem; pointer-events: none;
        }

        input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: border-color 0.2s, background 0.2s;
        }
        input:focus {
            border-color: rgba(0,229,255,0.6) !important;
            background: rgba(255, 255, 255, 0.08) !important;
        }
        input::placeholder { color: rgba(255,255,255,0.35); }

        .btn-cyan {
            background: linear-gradient(135deg, #00e5ff, #00b8d4);
            border: none;
            color: #06121a;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            box-shadow: 0 8px 24px rgba(0,229,255,0.25);
        }
        .btn-cyan:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 12px 32px rgba(0,229,255,0.4);
        }
        .btn-cyan:active { transform: translateY(0); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.5s ease both; }
    </style>
</head>
<body class="p-6">
    <div class="w-full max-w-md relative" style="z-index:1;">
        <div class="text-center mb-8 fade-up">
            <img src="logo.png" alt="Logo Tsunami" class="logo-badge" onerror="this.style.display='none'">
            <h1 class="font-brand text-4xl font-extrabold tracking-[0.2em] neon-text">TSUNAMI</h1>
            <p class="text-[10px] uppercase tracking-[0.4em] text-cyan-200/40 mt-2">Frequência &amp; Gestão</p>
        </div>
        <div class="glass p-8 rounded-3xl fade-up" style="animation-delay:.08s">
            <h2 id="formTitle" class="text-xl font-bold mb-6 uppercase text-center tracking-widest font-brand">Login</h2>
            <form id="authForm" class="space-y-4">
                <div class="field-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nome" class="w-full p-3 pl-10 rounded-xl outline-none" placeholder="Nome/Email" required>
                </div>
                <div class="field-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="senha" class="w-full p-3 pl-10 rounded-xl outline-none" placeholder="Senha" required>
                </div>
                <button type="submit" id="submitBtn" class="w-full btn-cyan p-3 rounded-xl font-bold uppercase tracking-widest">Entrar</button>
            </form>
            <p class="mt-6 text-center text-xs text-gray-400">
                <span id="toggleText">Não tem conta? <span class="text-cyan-400 cursor-pointer underline" onclick="toggleForm()">Cadastre-se</span></span>
            </p>
        </div>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycby-23cMovuAZ0m6JouTueAara4JIYnAQVvRImBzhZWMh26gWhm0aB_KiFpRo2t2CcEQCA/exec";
        let isLogin = true;

        async function sincronizarUsuarios() {
            try {
                const resposta = await fetch(URL_SCRIPT + '?getDados=usuario');
                const dados = await resposta.json();
                
                if (Array.isArray(dados)) {
                    // LIMPA espaços em branco dos dados da planilha
                    const limpos = dados.map(u => ({
                        nome: (u.nome || "").toString().trim(),
                        senha: (u.senha || "").toString().trim()
                    }));
                    
                    localStorage.setItem('tsunami_users', JSON.stringify(limpos));
                    console.log("Sincronizado:", limpos);
                }
            } catch (err) {
                console.log('Erro sync:', err);
            }
        }

        sincronizarUsuarios();

        function toggleForm() {
            isLogin = !isLogin;
            document.getElementById('formTitle').innerText = isLogin ? "Login" : "Cadastro";
            document.getElementById('submitBtn').innerText = isLogin ? "Entrar" : "Criar Conta";
            document.getElementById('toggleText').innerHTML = isLogin 
                ? 'Não tem conta? <span class="text-cyan-400 cursor-pointer underline" onclick="toggleForm()">Cadastre-se</span>'
                : 'Já tem conta? <span class="text-cyan-400 cursor-pointer underline" onclick="toggleForm()">Fazer Login</span>';
        }

        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            // LIMPA espaços do input do usuário
            const nome = document.getElementById('nome').value.trim();
            const senha = document.getElementById('senha').value.trim();
            
            btn.innerText = "PROCESSANDO...";
            btn.style.opacity = "0.5";

            await sincronizarUsuarios();
            
            const users = JSON.parse(localStorage.getItem('tsunami_users')) || [];
            
            console.log("Digitado:", nome, "|", senha);
            console.log("Na planilha:", users);

            if (isLogin) {
                // COMPARAÇÃO EXATA (case-sensitive, mas sem espaços)
                const user = users.find(u => {
                    console.log("Comparando:", u.nome, "===", nome, "&&", u.senha, "===", senha);
                    return u.nome === nome && u.senha === senha;
                });
                
                if (user) {
                    sessionStorage.setItem('tsunami_logged', 'true');
                    window.location.href = 'index.html';
                } else {
                    alert('Credenciais inválidas!\n\nVerifique:\n- Nome: ' + nome + '\n- Senha: ' + senha);
                    btn.innerText = "Entrar";
                    btn.style.opacity = "1";
                }
            } else {
                if (users.find(u => u.nome === nome)) {
                    alert('Este nome já existe!');
                    btn.innerText = "Criar Conta";
                    btn.style.opacity = "1";
                    return;
                }

                users.push({ nome, senha });
                localStorage.setItem('tsunami_users', JSON.stringify(users));

                try {
                    const formData = new FormData();
                    formData.append('action', 'usuario');
                    formData.append('nome', nome);
                    formData.append('senha', senha);
                    
                    await fetch(URL_SCRIPT, { method: 'POST', body: formData });
                    alert('Conta criada!');
                    toggleForm();
                } catch (err) {
                    alert('Salvo localmente.');
                }
                
                btn.innerText = "Entrar";
                btn.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
